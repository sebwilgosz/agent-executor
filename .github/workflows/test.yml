name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every script test
        run: |
          fail=0
          for t in scripts/*.test.sh; do
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else echo "::error::$t failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit "$fail"
      - name: Self-audit
        run: bash scripts/self-audit.sh -v --strict
